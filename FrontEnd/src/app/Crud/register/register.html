<form
  [formGroup]="RegisterFrm"
  (ngSubmit)="RegisterNow()"
  class="form border border-dark w-50 mx-auto d-block p-3 m-3"
>
  <h3>User Register !</h3>
  <hr />
  <div>
    <label class="form-label">UserName :</label>
    <input type="text" placeholder="User Name" class="form-control" formControlName="uname" />
  </div>

  <div class="mt-3">
    <label class="form-label">Email :</label>
    <input type="email" placeholder="User Email" class="form-control" formControlName="email" />
  </div>

  <div class="mt-3">
    <label class="form-label">Password :</label>
    <input
      type="password"
      placeholder="User Password"
      class="form-control"
      formControlName="password"
    />
  </div>

  <div class="mt-3">
    <label class="form-label">Assign Role :</label>
    <select formControlName="roleId" class="form-control">
      <option value="" disabled selected>Select Role</option>
      <option value="1">Admin</option>
      <option value="2">Student</option>
    </select>
  </div>

  @if (IsRegiMsg != '') {
    <div class="alert alert-success mt-3" role="alert">
      <strong>{{ IsRegiMsg }}</strong>
    </div>
  }

  @if (IsErrorMsg) {
    <div class="alert alert-danger mt-3">
      {{ IsErrorMsg }}
    </div>
  }
  <div class="mt-3">
    <button type="submit" [disabled]="Isloading" class="btn btn-success w-100">
      {{ Isloading ? 'Proccess..' : 'Register' }}
    </button>
    <a routerLink="/" class="btn btn-danger w-100 mt-2">Back</a>
  </div>
</form>
